stages:
  - check
  - build

check:
  stage: check
  image: oven/bun:alpine
  script:
    - bun install --frozen-lockfile
    - status=0
    - bun scripts/check-messages.js || status=1
    - bun scripts/find-untranslated.js || status=1
    - bun scripts/find-unused-messages.js || status=1
    - bun run lint || status=1
    - bun run test || status=1
    - exit $status

build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
